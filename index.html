<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stairway To Heaven</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 900px;
            width: 100%;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .caption {
            margin-top: 12px;
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Stairway to Heaven - Solo</h1>
    <div
        style="background-color: lightgray; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 900px;">
        <h2>Gallery 01
            <a href="https://www.youtube.com/watch?v=T8ZwZs6TeK8" target="_blank"
                style="text-decoration: none; color: #007BFF; font-weight: bold; margin: 10px;">Kelly Dean Allen
                Guitar</a>
        </h2>
        <div class="gallery" id="gallery"></div>
    </div>
    <div
        style="background-color: darkgrey; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 900px;">
        <h2>Gallery 02
            <a href="https://www.youtube.com/watch?v=wKpNTOGWwQk" target="_blank"
                style="text-decoration: none; color: #007BFF; font-weight: bold; margin: 10px;">Guitar TAB Master</a>
        </h2>
        <div class="gallery" id="gallery02"></div>
    </div>
    <div
        style="background-color: wheat; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 900px;">
        <h2>Gallery 03
            <a href="https://www.youtube.com/watch?v=zbcfo9a3b7w" target="_blank"
                style="text-decoration: none; color: #007BFF; font-weight: bold; margin: 10px;">Led zeppelin - Stairway
                to heaven Guitar Lesson with Tab (Slow Tempo)</a>
        </h2>
        <div class="gallery" id="gallery03"></div>
    </div>
    <div
        style="background-color: yellow; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 900px;">
        <h2>Gallery 04
            <a href="https://www.youtube.com/watch?v=zbcfo9a3b7w" target="_blank"
                style="text-decoration: none; color: #007BFF; font-weight: bold; margin: 10px;">Led zeppelin - Stairway
                to heaven Guitar Lesson with Tab (Slow Tempo)</a>
        </h2>
        <div class="gallery" id="gallery04"></div>
    </div>
    <script>


        addImagesToGallery('gallery', 'Gallery01', 12);
        addImagesToGallery('gallery02', 'Gallery02', 7);
        addImagesToGallery('gallery03', 'Gallery03', 9);
        addImagesToGallery('gallery04', 'Gallery04', 9);

        function addImagesToGallery(galleryId, subFolderName, count) {
            const gallery = document.getElementById(galleryId);

            // ⚠️ CHANGE THIS NUMBER TO YOUR TOTAL NUMBER OF IMAGES
            const totalImages = count;


            for (let i = 0; i < totalImages; i++) {
                // Handles your specific naming format: Stairway.png, Stairway (1).png, etc.
                const fileName = (i === 0) ? "Stairway.png" : `Stairway (${i}).png`;

                const card = document.createElement('div');
                card.className = 'card';

                const img = document.createElement('img');
                img.src = `${subFolderName}/${fileName}`;
                img.alt = `${subFolderName}/Screenshot ${i + 1}`;
                img.loading = "lazy"; // Ensures fast loading speeds

                const caption = document.createElement('div');
                caption.className = 'caption';
                caption.textContent = `Image ${i + 1}`;

                card.appendChild(img);
                card.appendChild(caption);
                gallery.appendChild(card);
            }
        }
    </script>

</body>

</html>
