<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Screenshot Gallery</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #333; margin-bottom: 20px; }
        .gallery { display: flex; flex-direction: column; gap: 25px; max-width: 900px; width: 100%; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #e0e0e0; }
        .caption { margin-top: 12px; color: #555; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>My Screenshots Sequence</h1>
    <div class="gallery" id="gallery"></div>

    <script>
        const gallery = document.getElementById('gallery');
        
        // ⚠️ CHANGE THIS NUMBER TO YOUR TOTAL NUMBER OF IMAGES
        const totalImages = 12; 

        for (let i = 0; i < totalImages; i++) {
            // Handles your specific naming format: Stairway.png, Stairway (1).png, etc.
            const fileName = (i === 0) ? "Stairway.png" : `Stairway (${i}).png`;
            
            const card = document.createElement('div');
            card.className = 'card';
            
            const img = document.createElement('img');
            img.src = fileName;
            img.alt = `Screenshot ${i + 1}`;
            img.loading = "lazy"; // Ensures fast loading speeds
            
            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = `Image ${i + 1}`;
            
            card.appendChild(img);
            card.appendChild(caption);
            gallery.appendChild(card);
        }
    </script>

</body>
</html>
